```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#e9e7f4">

    <title></title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e9e7f4;
        }

        body {
            position: fixed;
            inset: 0;
        }


        /* =========================================
           PREMIUM BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                linear-gradient(
                    125deg,
                    #eeeaf8 0%,
                    #e8edf9 34%,
                    #f5ebf1 68%,
                    #e8f3ef 100%
                );

            z-index: 0;
        }


        /* =========================================
           SOFT MOVING LIGHT
        ========================================= */

        .light {

            position: absolute;

            width: 75vw;
            height: 18vw;

            min-width: 500px;
            min-height: 180px;

            border-radius: 50%;

            filter: blur(65px);

            opacity: 0.16;

            pointer-events: none;
        }


        .light.one {

            top: 8%;
            left: -20%;

            background:
                linear-gradient(
                    90deg,
                    #d9c7ff,
                    #ffc8df,
                    #c9ddff
                );

            transform: rotate(-18deg);

            animation:
                lightMoveOne 24s ease-in-out infinite alternate;
        }


        .light.two {

            right: -25%;
            bottom: 5%;

            background:
                linear-gradient(
                    90deg,
                    #c9e4ff,
                    #d7f0e7,
                    #e7d0ff
                );

            transform: rotate(16deg);

            animation:
                lightMoveTwo 30s ease-in-out infinite alternate;
        }


        @keyframes lightMoveOne {

            0% {
                transform:
                    translate3d(-2%, 0, 0)
                    rotate(-18deg)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(10%, 5%, 0)
                    rotate(-12deg)
                    scale(1.05);
            }

            100% {
                transform:
                    translate3d(20%, 0, 0)
                    rotate(-20deg)
                    scale(1.02);
            }
        }


        @keyframes lightMoveTwo {

            0% {
                transform:
                    translate3d(3%, 0, 0)
                    rotate(16deg)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-9%, -5%, 0)
                    rotate(11deg)
                    scale(1.06);
            }

            100% {
                transform:
                    translate3d(-18%, 0, 0)
                    rotate(18deg)
                    scale(1.02);
            }
        }


        /* =========================================
           SUBTLE GRAIN
        ========================================= */

        .grain {

            position: absolute;

            inset: 0;

            opacity: 0.025;

            pointer-events: none;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");

            mix-blend-mode: soft-light;
        }


        /* =========================================
           VIDEO
        ========================================= */

        .video-wrapper {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 2;

            opacity: 0;

            animation:
                videoAppear 1.2s ease forwards;
        }


        @keyframes videoAppear {

            from {
                opacity: 0;
                transform: scale(0.985);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        #mainVideo {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: transparent;
        }


        /* =========================================
           VIGNETTE
        ========================================= */

        .vignette {

            position: fixed;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 68%,
                    rgba(55,48,75,0.08) 100%
                );
        }


        /* =========================================
           INSTAGRAM GLASS PILL
        ========================================= */

        .instagram {

            position: fixed;

            left: 50%;

            bottom:
                max(22px, env(safe-area-inset-bottom));

            transform:
                translateX(-50%)
                translateY(12px);

            z-index: 7;

            display: flex;

            align-items: center;

            gap: 6px;

            padding: 7px 12px 7px 9px;

            border-radius: 999px;

            text-decoration: none;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.15px;

            /*
               Instagram gradient
            */

            background:
                linear-gradient(
                    90deg,
                    #f58529,
                    #dd2a7b,
                    #8134af,
                    #515bd4
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            /*
               Glass bubble
            */

            border:
                1px solid rgba(255,255,255,0.55);

            background-color:
                rgba(255,255,255,0.22);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 5px 22px rgba(76,65,105,0.10),
                inset 0 1px 1px rgba(255,255,255,0.65);

            opacity: 0;

            animation:
                instagramEntrance 1.1s 0.9s ease forwards,
                instagramFloat 5s 2s ease-in-out infinite;
        }


        /* =========================================
           INSTAGRAM REAL-STYLE GLYPH
        ========================================= */

        .instagram-icon {

            position: relative;

            width: 14px;
            height: 14px;

            flex-shrink: 0;

            border-radius: 4px;

            background:
                linear-gradient(
                    135deg,
                    #feda75 0%,
                    #fa7e1e 25%,
                    #d62976 55%,
                    #962fbf 78%,
                    #4f5bd5 100%
                );

            -webkit-text-fill-color: initial;

            box-shadow:
                0 2px 7px rgba(214,41,118,0.18);
        }


        /*
           Camera lens
        */

        .instagram-icon::before {

            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border:
                1.3px solid white;

            border-radius: 50%;
        }


        /*
           Camera top-right dot
        */

        .instagram-icon::after {

            content: "";

            position: absolute;

            width: 2.3px;
            height: 2.3px;

            top: 2.4px;
            right: 2.4px;

            border-radius: 50%;

            background: white;
        }


        /* =========================================
           INSTAGRAM HOVER
        ========================================= */

        .instagram:hover {

            transform:
                translateX(-50%)
                translateY(-2px);

            box-shadow:
                0 8px 28px rgba(76,65,105,0.15),
                0 0 18px rgba(214,41,118,0.10),
                inset 0 1px 1px rgba(255,255,255,0.75);
        }


        .instagram:active {

            transform:
                translateX(-50%)
                scale(0.94);
        }


        @keyframes instagramEntrance {

            0% {

                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(12px)
                    scale(0.92);
            }

            70% {

                opacity: 0.9;

                transform:
                    translateX(-50%)
                    translateY(-2px)
                    scale(1.02);
            }

            100% {

                opacity: 0.9;

                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes instagramFloat {

            0%,
            100% {

                margin-bottom: 0;
            }

            50% {

                margin-bottom: 3px;
            }
        }


        /* =========================================
           SOUND BUTTON
        ========================================= */

        #soundButton {

            position: fixed;

            right:
                max(18px, env(safe-area-inset-right));

            bottom:
                max(18px, env(safe-area-inset-bottom));

            width: 50px;
            height: 50px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,0.45);

            background:
                rgba(35,32,45,0.35);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 21px;

            cursor: pointer;

            z-index: 10;

            box-shadow:
                0 8px 25px rgba(60,50,80,0.18),
                inset 0 1px 1px rgba(255,255,255,0.22);

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        #soundButton:hover {

            transform: scale(1.08);

            background:
                rgba(35,32,45,0.55);
        }


        #soundButton:active {

            transform: scale(0.88);
        }


        /* =========================================
           SOUND BUTTON PULSE
        ========================================= */

        #soundButton::after {

            content: "";

            position: absolute;

            inset: -3px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,0.35);

            animation:
                buttonPulse 3.5s ease-in-out infinite;

            pointer-events: none;
        }


        @keyframes buttonPulse {

            0%,
            100% {
                transform: scale(0.95);
                opacity: 0;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.5;
            }
        }


        /* =========================================
           BUTTON CLICK
        ========================================= */

        #soundButton.clicked {

            animation:
                buttonClick 0.4s ease;
        }


        @keyframes buttonClick {

            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(0.82);
            }

            70% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            #soundButton {

                width: 46px;
                height: 46px;

                font-size: 19px;

                right:
                    max(15px, env(safe-area-inset-right));

                bottom:
                    max(15px, env(safe-area-inset-bottom));
            }


            .instagram {

                font-size: 10px;

                padding:
                    6px 10px 6px 8px;

                gap: 5px;

                bottom:
                    max(17px, env(safe-area-inset-bottom));
            }


            .instagram-icon {

                width: 12px;
                height: 12px;

                border-radius: 3.5px;
            }
        }


        /* =========================================
           LANDSCAPE
        ========================================= */

        @media (orientation: landscape) {

            #soundButton {

                right: 20px;
                bottom: 20px;
            }


            .instagram {

                bottom: 18px;
            }
        }


        /* =========================================
           REDUCED MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .light,
            #soundButton::after,
            .instagram {

                animation: none;
            }

            .video-wrapper {

                animation: none;

                opacity: 1;
            }

            .instagram {

                opacity: 0.9;

                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         PREMIUM BACKGROUND
    ========================================= -->

    <div class="background">

        <div class="light one"></div>

        <div class="light two"></div>

        <div class="grain"></div>

    </div>


    <!-- =========================================
         MAIN VIDEO
    ========================================= -->

    <div class="video-wrapper">

        <video
            id="mainVideo"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto">

            <source
                src="video.mp4"
                type="video/mp4">

        </video>

    </div>


    <!-- =========================================
         VIGNETTE
    ========================================= -->

    <div class="vignette"></div>


    <!-- =========================================
         INSTAGRAM LINK
    ========================================= -->

    <a
        class="instagram"
        href="https://www.instagram.com/gyankumar00/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram @gyankumar00">

        <span class="instagram-icon"></span>

        <span>@gyankumar00</span>

    </a>


    <!-- =========================================
         SOUND BUTTON
    ========================================= -->

    <button
        id="soundButton"
        aria-label="Turn sound on">

        🔇

    </button>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const video =
            document.getElementById("mainVideo");

        const soundButton =
            document.getElementById("soundButton");


        /* =========================================
           INITIAL VIDEO SETTINGS
        ========================================= */

        video.muted = true;

        video.volume = 1;


        /* =========================================
           AUTOPLAY
        ========================================= */

        function startVideo() {

            video.play().catch(() => {});

        }


        startVideo();


        /* =========================================
           SOUND BUTTON
        ========================================= */

        soundButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                video.muted = !video.muted;


                if (video.muted) {

                    soundButton.textContent = "🔇";

                    soundButton.setAttribute(
                        "aria-label",
                        "Turn sound on"
                    );

                } else {

                    video.volume = 1;

                    soundButton.textContent = "🔊";

                    soundButton.setAttribute(
                        "aria-label",
                        "Mute sound"
                    );

                    video.play().catch(() => {});

                }


                soundButton.classList.remove("clicked");

                void soundButton.offsetWidth;

                soundButton.classList.add("clicked");

            }
        );


        /* =========================================
           FIRST USER TOUCH
        ========================================= */

        function userInteraction() {

            if (!video.muted) {

                video.volume = 1;

                video.play().catch(() => {});

            }

        }


        document.addEventListener(
            "touchstart",
            userInteraction,
            { passive: true }
        );


        document.addEventListener(
            "click",
            userInteraction
        );


        /* =========================================
           PAGE VISIBILITY
        ========================================= */

        document.addEventListener(
            "visibilitychange",
            function() {

                if (!document.hidden) {

                    startVideo();

                }

            }
        );


        /* =========================================
           PREVENT VIDEO FROM STAYING PAUSED
        ========================================= */

        video.addEventListener(
            "pause",
            function() {

                if (!document.hidden) {

                    video.play().catch(() => {});

                }

            }
        );

    </script>

</body>

</html>
