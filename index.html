<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#080a12">

    <title></title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080a12;
        }

        body {
            position: fixed;
            inset: 0;
        }


        /* =========================================
           ANIMATED BACKGROUND
           THIS IS ONLY BEHIND THE VIDEO
        ========================================= */

        .background {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(93, 135, 255, 0.45),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(192, 104, 255, 0.38),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 50% 90%,
                    rgba(47, 220, 190, 0.28),
                    transparent 40%
                ),
                #080a12;

            animation: backgroundMove 12s ease-in-out infinite alternate;

            z-index: 0;
        }


        @keyframes backgroundMove {

            0% {
                transform: scale(1);
                filter: brightness(0.9);
            }

            50% {
                transform: scale(1.08);
                filter: brightness(1.08);
            }

            100% {
                transform: scale(1.02);
                filter: brightness(0.95);
            }
        }


        /* Additional soft floating glow */

        .background::before {

            content: "";

            position: absolute;

            width: 45vw;
            height: 45vw;

            min-width: 250px;
            min-height: 250px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 170, 120, 0.20),
                    transparent 70%
                );

            top: -15%;
            left: -10%;

            filter: blur(30px);

            animation: glowOne 9s ease-in-out infinite alternate;
        }


        .background::after {

            content: "";

            position: absolute;

            width: 50vw;
            height: 50vw;

            min-width: 280px;
            min-height: 280px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(90, 140, 255, 0.22),
                    transparent 70%
                );

            right: -15%;
            bottom: -15%;

            filter: blur(35px);

            animation: glowTwo 11s ease-in-out infinite alternate;
        }


        @keyframes glowOne {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(25vw, 18vh);
            }
        }


        @keyframes glowTwo {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-20vw, -15vh);
            }
        }


        /* =========================================
           VIDEO AREA
        ========================================= */

        .video-wrapper {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 2;

            opacity: 0;

            animation: videoAppear 1.2s ease forwards;
        }


        @keyframes videoAppear {

            from {
                opacity: 0;
                transform: scale(0.985);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* =========================================
           MAIN VIDEO
        ========================================= */

        #mainVideo {

            display: block;

            width: 100%;
            height: 100%;

            /*
                IMPORTANT:

                contain = NO CROPPING

                Video maintains its original
                aspect ratio.
            */

            object-fit: contain;

            background: transparent;

        }


        /* =========================================
           SUBTLE VIGNETTE
           ONLY VERY LIGHT
        ========================================= */

        .vignette {

            position: fixed;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 62%,
                    rgba(0, 0, 0, 0.18) 100%
                );
        }


        /* =========================================
           SOUND BUTTON
        ========================================= */

        #soundButton {

            position: fixed;

            right: max(18px, env(safe-area-inset-right));

            bottom: max(18px, env(safe-area-inset-bottom));

            width: 50px;
            height: 50px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.25);

            background: rgba(0,0,0,0.42);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 21px;

            cursor: pointer;

            z-index: 10;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.28),
                inset 0 1px 1px rgba(255,255,255,0.15);

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        #soundButton:hover {

            transform: scale(1.08);

            background: rgba(0,0,0,0.65);
        }


        #soundButton:active {

            transform: scale(0.88);
        }


        /* =========================================
           SOUND BUTTON PULSE
        ========================================= */

        #soundButton::after {

            content: "";

            position: absolute;

            inset: -3px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.25);

            animation: buttonPulse 3.5s ease-in-out infinite;

            pointer-events: none;
        }


        @keyframes buttonPulse {

            0%,
            100% {
                transform: scale(0.95);
                opacity: 0;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.5;
            }
        }


        /* =========================================
           BUTTON CLICK ANIMATION
        ========================================= */

        #soundButton.clicked {

            animation: buttonClick 0.4s ease;
        }


        @keyframes buttonClick {

            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(0.82);
            }

            70% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            #soundButton {

                width: 46px;
                height: 46px;

                font-size: 19px;

                right: max(15px, env(safe-area-inset-right));

                bottom: max(15px, env(safe-area-inset-bottom));
            }

        }


        /* =========================================
           LANDSCAPE
        ========================================= */

        @media (orientation: landscape) {

            #soundButton {

                right: 20px;
                bottom: 20px;
            }

        }


        /* =========================================
           REDUCED MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .background,
            .background::before,
            .background::after,
            #soundButton::after {

                animation: none;
            }

            .video-wrapper {

                animation: none;

                opacity: 1;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         ANIMATED BACKGROUND
         (ONLY VISIBLE WHERE VIDEO DOESN'T COVER)
    ========================================= -->

    <div class="background"></div>


    <!-- =========================================
         MAIN VIDEO
    ========================================= -->

    <div class="video-wrapper">

        <video
            id="mainVideo"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto">

            <source
                src="video.mp4"
                type="video/mp4">

        </video>

    </div>


    <!-- =========================================
         SUBTLE VIGNETTE
    ========================================= -->

    <div class="vignette"></div>


    <!-- =========================================
         SOUND BUTTON
    ========================================= -->

    <button
        id="soundButton"
        aria-label="Turn sound on">

        🔇

    </button>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const video =
            document.getElementById("mainVideo");

        const soundButton =
            document.getElementById("soundButton");


        /* =========================================
           INITIAL VIDEO SETTINGS
        ========================================= */

        video.muted = true;

        video.volume = 1;


        /* =========================================
           AUTOPLAY
        ========================================= */

        function startVideo() {

            video.play().catch(() => {});

        }


        startVideo();


        /* =========================================
           SOUND BUTTON
        ========================================= */

        soundButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();


                /* Toggle */

                video.muted = !video.muted;


                if (video.muted) {

                    soundButton.textContent = "🔇";

                    soundButton.setAttribute(
                        "aria-label",
                        "Turn sound on"
                    );

                } else {

                    /* Maximum VIDEO volume */

                    video.volume = 1;

                    soundButton.textContent = "🔊";

                    soundButton.setAttribute(
                        "aria-label",
                        "Mute sound"
                    );

                    video.play().catch(() => {});

                }


                /* Button animation */

                soundButton.classList.remove("clicked");

                void soundButton.offsetWidth;

                soundButton.classList.add("clicked");

            }
        );


        /* =========================================
           FIRST USER TOUCH
           Browser audio permission
        ========================================= */

        function userInteraction() {

            if (!video.muted) {

                video.volume = 1;

                video.play().catch(() => {});

            }

        }


        document.addEventListener(
            "touchstart",
            userInteraction,
            { passive: true }
        );


        document.addEventListener(
            "click",
            userInteraction
        );


        /* =========================================
           IF PAGE BECOMES VISIBLE AGAIN
        ========================================= */

        document.addEventListener(
            "visibilitychange",
            function() {

                if (!document.hidden) {

                    startVideo();

                }

            }
        );


        /* =========================================
           PREVENT VIDEO FROM STAYING PAUSED
        ========================================= */

        video.addEventListener(
            "pause",
            function() {

                if (!document.hidden) {

                    video.play().catch(() => {});

                }

            }
        );


    </script>

</body>

</html>
