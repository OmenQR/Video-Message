<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#e9e7f4">

    <title></title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e9e7f4;
        }

        body {
            position: fixed;
            inset: 0;
        }


        /* =========================================
           PREMIUM ANIMATED BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: -8%;
            width: 116%;
            height: 116%;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 12% 18%,
                    rgba(255, 196, 220, 0.72),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 88% 20%,
                    rgba(183, 211, 255, 0.72),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 52% 92%,
                    rgba(193, 236, 224, 0.68),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 48% 45%,
                    rgba(232, 216, 255, 0.65),
                    transparent 42%
                ),
                #e9e7f4;

            z-index: 0;

            animation:
                backgroundDrift 18s ease-in-out infinite alternate;
        }


        /* =========================================
           SOFT FLOATING LIGHTS
        ========================================= */

        .background::before,
        .background::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(45px);
        }


        .background::before {

            width: 42vw;
            height: 42vw;

            min-width: 260px;
            min-height: 260px;

            top: -12%;
            left: 12%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 214, 169, 0.55),
                    rgba(255, 214, 169, 0.05) 65%,
                    transparent 75%
                );

            animation:
                orbOne 15s cubic-bezier(.45,.05,.55,.95) infinite alternate;
        }


        .background::after {

            width: 48vw;
            height: 48vw;

            min-width: 280px;
            min-height: 280px;

            right: -12%;
            bottom: -15%;

            background:
                radial-gradient(
                    circle,
                    rgba(169, 207, 255, 0.55),
                    rgba(169, 207, 255, 0.04) 65%,
                    transparent 75%
                );

            animation:
                orbTwo 19s cubic-bezier(.45,.05,.55,.95) infinite alternate;
        }


        @keyframes backgroundDrift {

            0% {
                transform: scale(1) translate3d(0, 0, 0);
                filter: saturate(0.95);
            }

            50% {
                transform: scale(1.035) translate3d(-1%, 1%, 0);
                filter: saturate(1.08);
            }

            100% {
                transform: scale(1.06) translate3d(1%, -1%, 0);
                filter: saturate(1);
            }
        }


        @keyframes orbOne {

            0% {
                transform: translate3d(-4vw, -2vh, 0) scale(0.9);
                opacity: 0.65;
            }

            50% {
                transform: translate3d(15vw, 12vh, 0) scale(1.12);
                opacity: 0.85;
            }

            100% {
                transform: translate3d(27vw, 4vh, 0) scale(0.96);
                opacity: 0.68;
            }
        }


        @keyframes orbTwo {

            0% {
                transform: translate3d(3vw, 5vh, 0) scale(0.95);
                opacity: 0.65;
            }

            50% {
                transform: translate3d(-15vw, -10vh, 0) scale(1.12);
                opacity: 0.82;
            }

            100% {
                transform: translate3d(-25vw, -3vh, 0) scale(0.96);
                opacity: 0.65;
            }
        }


        /* =========================================
           SUBTLE LIGHT GRAINS / PARTICLES
        ========================================= */

        .background .particle-layer {

            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(255,255,255,0.35) 0,
                    rgba(255,255,255,0.35) 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 70% 65%,
                    rgba(255,255,255,0.25) 0,
                    rgba(255,255,255,0.25) 1px,
                    transparent 2px
                );

            background-size:
                145px 145px,
                190px 190px;

            opacity: 0.28;

            animation: particlesMove 24s linear infinite;

            pointer-events: none;
        }


        @keyframes particlesMove {

            from {
                transform: translate3d(0, 0, 0);
            }

            to {
                transform: translate3d(-70px, -45px, 0);
            }
        }


        /* =========================================
           VIDEO AREA
        ========================================= */

        .video-wrapper {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 2;

            opacity: 0;

            animation: videoAppear 1.2s ease forwards;
        }


        @keyframes videoAppear {

            from {
                opacity: 0;
                transform: scale(0.985);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* =========================================
           MAIN VIDEO
        ========================================= */

        #mainVideo {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: transparent;
        }


        /* =========================================
           SUBTLE VIGNETTE
        ========================================= */

        .vignette {

            position: fixed;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 64%,
                    rgba(65, 55, 90, 0.10) 100%
                );
        }


        /* =========================================
           INSTAGRAM HANDLE
        ========================================= */

        .instagram {

            position: fixed;

            left: 50%;

            bottom: max(22px, env(safe-area-inset-bottom));

            transform:
                translateX(-50%)
                translateY(8px);

            z-index: 6;

            opacity: 0;

            animation:
                instagramAppear 1.4s 0.8s ease forwards;

            text-decoration: none;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 0.35px;

            color: rgba(45, 42, 58, 0.62);

            padding: 7px 11px;

            border: 1px solid rgba(255,255,255,0.45);

            border-radius: 999px;

            background: rgba(255,255,255,0.18);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 4px 18px rgba(80,70,110,0.08),
                inset 0 1px 1px rgba(255,255,255,0.5);

            transition:
                transform 0.35s ease,
                background 0.35s ease,
                color 0.35s ease,
                box-shadow 0.35s ease;
        }


        .instagram:hover {

            transform:
                translateX(-50%)
                translateY(-2px);

            color: rgba(35, 32, 50, 0.82);

            background: rgba(255,255,255,0.32);

            box-shadow:
                0 7px 24px rgba(80,70,110,0.12),
                inset 0 1px 1px rgba(255,255,255,0.65);
        }


        .instagram:active {

            transform:
                translateX(-50%)
                scale(0.96);
        }


        @keyframes instagramAppear {

            0% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(8px);
            }

            100% {
                opacity: 0.88;
                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }


        /* Very subtle floating movement */

        .instagram {

            animation:
                instagramAppear 1.4s 0.8s ease forwards,
                instagramFloat 5s 2.5s ease-in-out infinite;
        }


        @keyframes instagramFloat {

            0%,
            100% {
                margin-bottom: 0;
            }

            50% {
                margin-bottom: 3px;
            }
        }


        /* =========================================
           SOUND BUTTON
        ========================================= */

        #soundButton {

            position: fixed;

            right: max(18px, env(safe-area-inset-right));

            bottom: max(18px, env(safe-area-inset-bottom));

            width: 50px;
            height: 50px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.45);

            background: rgba(35,32,45,0.35);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 21px;

            cursor: pointer;

            z-index: 10;

            box-shadow:
                0 8px 25px rgba(60,50,80,0.18),
                inset 0 1px 1px rgba(255,255,255,0.22);

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        #soundButton:hover {

            transform: scale(1.08);

            background: rgba(35,32,45,0.55);
        }


        #soundButton:active {

            transform: scale(0.88);
        }


        /* =========================================
           SOUND BUTTON PULSE
        ========================================= */

        #soundButton::after {

            content: "";

            position: absolute;

            inset: -3px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.35);

            animation: buttonPulse 3.5s ease-in-out infinite;

            pointer-events: none;
        }


        @keyframes buttonPulse {

            0%,
            100% {
                transform: scale(0.95);
                opacity: 0;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.5;
            }
        }


        /* =========================================
           BUTTON CLICK ANIMATION
        ========================================= */

        #soundButton.clicked {

            animation: buttonClick 0.4s ease;
        }


        @keyframes buttonClick {

            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(0.82);
            }

            70% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            #soundButton {

                width: 46px;
                height: 46px;

                font-size: 19px;

                right: max(15px, env(safe-area-inset-right));

                bottom: max(15px, env(safe-area-inset-bottom));
            }


            .instagram {

                font-size: 10px;

                padding: 6px 9px;

                bottom:
                    max(17px, env(safe-area-inset-bottom));
            }
        }


        /* =========================================
           LANDSCAPE
        ========================================= */

        @media (orientation: landscape) {

            #soundButton {

                right: 20px;
                bottom: 20px;
            }


            .instagram {

                bottom: 18px;
            }
        }


        /* =========================================
           REDUCED MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .background,
            .background::before,
            .background::after,
            .background .particle-layer,
            #soundButton::after,
            .instagram {

                animation: none;
            }

            .video-wrapper {

                animation: none;

                opacity: 1;
            }

            .instagram {

                opacity: 0.88;

                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         ANIMATED BACKGROUND
    ========================================= -->

    <div class="background">

        <div class="particle-layer"></div>

    </div>


    <!-- =========================================
         MAIN VIDEO
    ========================================= -->

    <div class="video-wrapper">

        <video
            id="mainVideo"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto">

            <source
                src="video.mp4"
                type="video/mp4">

        </video>

    </div>


    <!-- =========================================
         SUBTLE VIGNETTE
    ========================================= -->

    <div class="vignette"></div>


    <!-- =========================================
         INSTAGRAM
    ========================================= -->

    <a
        class="instagram"
        href="https://www.instagram.com/gyankumar00/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram @gyankumar00">

        @gyankumar00

    </a>


    <!-- =========================================
         SOUND BUTTON
    ========================================= -->

    <button
        id="soundButton"
        aria-label="Turn sound on">

        🔇

    </button>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const video =
            document.getElementById("mainVideo");

        const soundButton =
            document.getElementById("soundButton");


        /* =========================================
           INITIAL VIDEO SETTINGS
        ========================================= */

        video.muted = true;

        video.volume = 1;


        /* =========================================
           AUTOPLAY
        ========================================= */

        function startVideo() {

            video.play().catch(() => {});

        }


        startVideo();


        /* =========================================
           SOUND BUTTON
        ========================================= */

        soundButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();


                video.muted = !video.muted;


                if (video.muted) {

                    soundButton.textContent = "🔇";

                    soundButton.setAttribute(
                        "aria-label",
                        "Turn sound on"
                    );

                } else {

                    video.volume = 1;

                    soundButton.textContent = "🔊";

                    soundButton.setAttribute(
                        "aria-label",
                        "Mute sound"
                    );

                    video.play().catch(() => {});

                }


                soundButton.classList.remove("clicked");

                void soundButton.offsetWidth;

                soundButton.classList.add("clicked");

            }
        );


        /* =========================================
           FIRST USER TOUCH
        ========================================= */

        function userInteraction() {

            if (!video.muted) {

                video.volume = 1;

                video.play().catch(() => {});

            }

        }


        document.addEventListener(
            "touchstart",
            userInteraction,
            { passive: true }
        );


        document.addEventListener(
            "click",
            userInteraction
        );


        /* =========================================
           PAGE VISIBILITY
        ========================================= */

        document.addEventListener(
            "visibilitychange",
            function() {

                if (!document.hidden) {

                    startVideo();

                }

            }
        );


        /* =========================================
           PREVENT VIDEO FROM STAYING PAUSED
        ========================================= */

        video.addEventListener(
            "pause",
            function() {

                if (!document.hidden) {

                    video.play().catch(() => {});

                }

            }
        );

    </script>

</body>

</html>
