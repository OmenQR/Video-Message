<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        video {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            object-fit: cover;

            background: #000;
        }
    </style>
</head>

<body>

    <video
        id="video"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
    >
        <source src="video.mp4" type="video/mp4">
    </video>

    <script>

        const video = document.getElementById("video");

        function playVideo() {
            video.play().catch(() => {});
        }

        playVideo();

        video.addEventListener("loadeddata", playVideo);

        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) {
                playVideo();
            }
        });

    </script>

</body>

</html>
