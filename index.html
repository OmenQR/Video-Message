<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#e9e7f4">

    <title></title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e9e7f4;
        }

        body {
            position: fixed;
            inset: 0;
        }


        /* =========================================
           PREMIUM BACKGROUND
        ========================================= */

        .background {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                linear-gradient(
                    125deg,
                    #eeeaf8 0%,
                    #e8edf9 34%,
                    #f5ebf1 68%,
                    #e8f3ef 100%
                );

            z-index: 0;
        }


        /* =========================================
           SOFT MOVING AURORA
        ========================================= */

        .light {

            position: absolute;

            width: 75vw;
            height: 18vw;

            min-width: 500px;
            min-height: 180px;

            border-radius: 50%;

            filter: blur(65px);

            opacity: 0.14;

            pointer-events: none;

            will-change: transform;
        }


        .light.one {

            top: 8%;
            left: -20%;

            background:
                linear-gradient(
                    90deg,
                    #d9c7ff,
                    #ffc8df,
                    #c9ddff
                );

            transform: rotate(-18deg);

            animation:
                lightMoveOne 28s ease-in-out infinite alternate;
        }


        .light.two {

            right: -25%;
            bottom: 5%;

            background:
                linear-gradient(
                    90deg,
                    #c9e4ff,
                    #d7f0e7,
                    #e7d0ff
                );

            transform: rotate(16deg);

            animation:
                lightMoveTwo 34s ease-in-out infinite alternate;
        }


        @keyframes lightMoveOne {

            0% {
                transform:
                    translate3d(-2%, 0, 0)
                    rotate(-18deg)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(9%, 4%, 0)
                    rotate(-12deg)
                    scale(1.04);
            }

            100% {
                transform:
                    translate3d(17%, 0, 0)
                    rotate(-20deg)
                    scale(1.02);
            }
        }


        @keyframes lightMoveTwo {

            0% {
                transform:
                    translate3d(3%, 0, 0)
                    rotate(16deg)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-8%, -4%, 0)
                    rotate(11deg)
                    scale(1.04);
            }

            100% {
                transform:
                    translate3d(-16%, 0, 0)
                    rotate(18deg)
                    scale(1.02);
            }
        }


        /* =========================================
           SUBTLE GRAIN
        ========================================= */

        .grain {

            position: absolute;

            inset: 0;

            opacity: 0.022;

            pointer-events: none;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");

            mix-blend-mode: soft-light;
        }


        /* =========================================
           VIDEO
        ========================================= */

        .video-wrapper {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 2;

            opacity: 0;

            animation:
                videoAppear 1.2s ease forwards;
        }


        @keyframes videoAppear {

            from {
                opacity: 0;
                transform: scale(0.985);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        #mainVideo {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: transparent;
        }


        /* =========================================
           VIGNETTE
        ========================================= */

        .vignette {

            position: fixed;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 68%,
                    rgba(55,48,75,0.07) 100%
                );
        }


        /* =========================================
           INSTAGRAM BADGE
           POSITION IS CONTROLLED BY JAVASCRIPT
        ========================================= */

        .instagram {

            position: fixed;

            /*
                JS changes these dynamically.
                This allows the badge to always
                stay in unused video space.
            */

            left: var(--ig-left, 50%);

            top: var(--ig-top, auto);

            bottom: var(--ig-bottom, 22px);

            transform:
                translate(-50%, 10px)
                scale(0.96);

            z-index: 8;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            min-width: max-content;

            padding:
                7px 12px 7px 9px;

            border-radius: 999px;

            text-decoration: none;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.1px;

            color: #dd2a7b;

            opacity: 0;

            /*
                Solid enough to separate
                from the background.
            */

            background:
                rgba(255, 255, 255, 0.88);

            border:
                1px solid rgba(255,255,255,0.95);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 5px 20px rgba(65,55,90,0.12),
                inset 0 1px 1px rgba(255,255,255,1);

            will-change:
                transform,
                opacity;

            transition:
                transform 0.28s cubic-bezier(.2,.8,.2,1),
                box-shadow 0.28s ease;
        }


        /* =========================================
           INSTAGRAM GRADIENT TEXT
        ========================================= */

        .instagram-text {

            background:
                linear-gradient(
                    90deg,
                    #f58529 0%,
                    #dd2a7b 38%,
                    #8134af 72%,
                    #515bd4 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            background-size: 200% 100%;

            animation:
                instagramTextGradient 7s ease-in-out infinite;
        }


        @keyframes instagramTextGradient {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }


        /* =========================================
           REAL INSTAGRAM-STYLE ICON
        ========================================= */

        .instagram-logo {

            width: 15px;
            height: 15px;

            flex-shrink: 0;

            display: block;

            filter:
                drop-shadow(
                    0 2px 4px
                    rgba(214,41,118,0.18)
                );

            animation:
                instagramIconPulse 5s ease-in-out infinite;
        }


        @keyframes instagramIconPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.055);
            }
        }


        /* =========================================
           INSTAGRAM BORDER SHIMMER
        ========================================= */

        .instagram::before {

            content: "";

            position: absolute;

            inset: -1px;

            border-radius: inherit;

            padding: 1px;

            background:
                linear-gradient(
                    110deg,
                    rgba(245,133,41,0.45),
                    rgba(221,42,123,0.65),
                    rgba(129,52,175,0.5),
                    rgba(81,91,212,0.55),
                    rgba(245,133,41,0.45)
                );

            background-size: 250% 100%;

            animation:
                instagramBorder 6s linear infinite;

            /*
                Keep only the border visible.
            */

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;

            mask-composite: exclude;

            pointer-events: none;
        }


        @keyframes instagramBorder {

            from {
                background-position: 0% 50%;
            }

            to {
                background-position: 250% 50%;
            }
        }


        /* =========================================
           VERY SUBTLE FLOAT
        ========================================= */

        .instagram.visible {

            opacity: 0.94;

            animation:
                instagramEntrance 0.9s
                cubic-bezier(.2,.8,.2,1)
                forwards,

                instagramFloat 5.5s
                ease-in-out
                1s
                infinite;
        }


        @keyframes instagramEntrance {

            0% {

                opacity: 0;

                transform:
                    translate(-50%, 12px)
                    scale(0.94);
            }

            70% {

                opacity: 0.94;

                transform:
                    translate(-50%, -1px)
                    scale(1.01);
            }

            100% {

                opacity: 0.94;

                transform:
                    translate(-50%, 0)
                    scale(1);
            }
        }


        @keyframes instagramFloat {

            0%,
            100% {

                transform:
                    translate(-50%, 0);
            }

            50% {

                transform:
                    translate(-50%, -3px);
            }
        }


        /* =========================================
           HOVER
        ========================================= */

        .instagram:hover {

            transform:
                translate(-50%, -3px)
                scale(1.035);

            box-shadow:
                0 8px 25px
                rgba(65,55,90,0.16),

                0 0 18px
                rgba(221,42,123,0.10),

                inset 0 1px 1px
                rgba(255,255,255,1);
        }


        .instagram:active {

            transform:
                translate(-50%, 0)
                scale(0.95);
        }


        /* =========================================
           SOUND BUTTON
        ========================================= */

        #soundButton {

            position: fixed;

            right:
                max(18px, env(safe-area-inset-right));

            bottom:
                max(18px, env(safe-area-inset-bottom));

            width: 50px;
            height: 50px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,0.45);

            background:
                rgba(35,32,45,0.35);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 21px;

            cursor: pointer;

            z-index: 10;

            box-shadow:
                0 8px 25px rgba(60,50,80,0.18),
                inset 0 1px 1px rgba(255,255,255,0.22);

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        #soundButton:hover {

            transform: scale(1.08);

            background:
                rgba(35,32,45,0.55);
        }


        #soundButton:active {

            transform: scale(0.88);
        }


        /* =========================================
           SOUND BUTTON PULSE
        ========================================= */

        #soundButton::after {

            content: "";

            position: absolute;

            inset: -3px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,0.35);

            animation:
                buttonPulse 3.5s ease-in-out infinite;

            pointer-events: none;
        }


        @keyframes buttonPulse {

            0%,
            100% {
                transform: scale(0.95);
                opacity: 0;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.5;
            }
        }


        /* =========================================
           BUTTON CLICK
        ========================================= */

        #soundButton.clicked {

            animation:
                buttonClick 0.4s ease;
        }


        @keyframes buttonClick {

            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(0.82);
            }

            70% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            #soundButton {

                width: 46px;
                height: 46px;

                font-size: 19px;

                right:
                    max(15px, env(safe-area-inset-right));

                bottom:
                    max(15px, env(safe-area-inset-bottom));
            }


            .instagram {

                font-size: 11px;

                padding:
                    7px 11px 7px 8px;

                gap: 5px;
            }


            .instagram-logo {

                width: 14px;
                height: 14px;
            }
        }


        /* =========================================
           REDUCED MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .light,
            .instagram-text,
            .instagram-logo,
            .instagram::before,
            #soundButton::after {

                animation: none;
            }

            .video-wrapper {

                animation: none;

                opacity: 1;
            }

            .instagram {

                animation: none;

                opacity: 0.94;

                transform:
                    translate(-50%, 0);
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         BACKGROUND
    ========================================= -->

    <div class="background">

        <div class="light one"></div>

        <div class="light two"></div>

        <div class="grain"></div>

    </div>


    <!-- =========================================
         VIDEO
    ========================================= -->

    <div class="video-wrapper">

        <video
            id="mainVideo"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto">

            <source
                src="video.mp4"
                type="video/mp4">

        </video>

    </div>


    <!-- =========================================
         VIGNETTE
    ========================================= -->

    <div class="vignette"></div>


    <!-- =========================================
         INSTAGRAM
    ========================================= -->

    <a
        class="instagram"
        id="instagramLink"
        href="https://www.instagram.com/gyankumar00/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram @gyankumar00">


        <!-- Proper Instagram-style SVG -->

        <svg
            class="instagram-logo"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true">

            <defs>

                <linearGradient
                    id="igGradient"
                    x1="0%"
                    y1="100%"
                    x2="100%"
                    y2="0%">

                    <stop
                        offset="0%"
                        stop-color="#feda75"/>

                    <stop
                        offset="25%"
                        stop-color="#fa7e1e"/>

                    <stop
                        offset="50%"
                        stop-color="#d62976"/>

                    <stop
                        offset="75%"
                        stop-color="#962fbf"/>

                    <stop
                        offset="100%"
                        stop-color="#4f5bd5"/>

                </linearGradient>

            </defs>


            <rect
                x="2"
                y="2"
                width="20"
                height="20"
                rx="5.5"
                fill="url(#igGradient)"/>


            <circle
                cx="12"
                cy="12"
                r="4.4"
                fill="none"
                stroke="white"
                stroke-width="1.8"/>


            <circle
                cx="17.4"
                cy="6.7"
                r="1.25"
                fill="white"/>

        </svg>


        <span class="instagram-text">
            @gyankumar00
        </span>

    </a>


    <!-- =========================================
         SOUND BUTTON
    ========================================= -->

    <button
        id="soundButton"
        aria-label="Turn sound on">

        🔇

    </button>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const video =
            document.getElementById("mainVideo");

        const soundButton =
            document.getElementById("soundButton");

        const instagramLink =
            document.getElementById("instagramLink");


        /* =========================================
           INITIAL VIDEO
        ========================================= */

        video.muted = true;

        video.volume = 1;


        function startVideo() {

            video.play().catch(() => {});

        }


        startVideo();


        /* =========================================
           DYNAMIC INSTAGRAM POSITION
           =========================================

           This is the important part.

           We calculate the ACTUAL visible
           dimensions of the video after
           object-fit: contain.

           Landscape:
           -> Instagram goes into LEFT
              empty area.

           Portrait:
           -> Instagram goes into BOTTOM
              empty area.
        */

        function positionInstagram() {

            const viewportWidth =
                window.innerWidth;

            const viewportHeight =
                window.innerHeight;


            const videoWidth =
                video.videoWidth;

            const videoHeight =
                video.videoHeight;


            /*
               If video metadata isn't loaded yet,
               wait until it is.
            */

            if (!videoWidth || !videoHeight) {

                return;
            }


            /*
               Calculate actual displayed
               video dimensions with object-fit: contain.
            */

            const videoRatio =
                videoWidth / videoHeight;

            const viewportRatio =
                viewportWidth / viewportHeight;


            let displayedWidth;
            let displayedHeight;


            if (videoRatio > viewportRatio) {

                /*
                   Video limited by width
                */

                displayedWidth =
                    viewportWidth;

                displayedHeight =
                    viewportWidth / videoRatio;

            } else {

                /*
                   Video limited by height
                */

                displayedHeight =
                    viewportHeight;

                displayedWidth =
                    viewportHeight * videoRatio;
            }


            /*
               Empty spaces
            */

            const horizontalSpace =
                viewportWidth - displayedWidth;

            const verticalSpace =
                viewportHeight - displayedHeight;


            /*
               Portrait / vertically limited video
               has useful bottom space.
            */

            if (
                verticalSpace > 45 &&
                verticalSpace >= horizontalSpace
            ) {

                /*
                   Put badge in the bottom
                   empty region.
                */

                instagramLink.style.setProperty(
                    "--ig-left",
                    "50%"
                );

                instagramLink.style.setProperty(
                    "--ig-top",
                    "auto"
                );

                instagramLink.style.setProperty(
                    "--ig-bottom",
                    Math.max(
                        12,
                        verticalSpace / 2 - 8
                    ) + "px"
                );

            }


            /*
               Landscape / horizontally limited video
               has empty side space.
            */

            else if (horizontalSpace > 45) {

                /*
                   Put badge in LEFT empty region.

                   Center of left empty area:
                   horizontalSpace / 4
                */

                const leftPosition =
                    horizontalSpace / 4;


                instagramLink.style.setProperty(
                    "--ig-left",
                    leftPosition + "px"
                );

                instagramLink.style.setProperty(
                    "--ig-top",
                    "50%"
                );

                instagramLink.style.setProperty(
                    "--ig-bottom",
                    "auto"
                );

            }


            /*
               If there isn't enough empty area,
               hide it instead of placing it
               over the video.
            */

            else {

                instagramLink.style.opacity = "0";

                return;
            }


            /*
               Show after correct position
               has been calculated.
            */

            instagramLink.classList.add("visible");
        }


        /* =========================================
           VIDEO READY
        ========================================= */

        video.addEventListener(
            "loadedmetadata",
            function() {

                positionInstagram();

            }
        );


        /* =========================================
           WINDOW RESIZE
        ========================================= */

        let resizeTimer;


        window.addEventListener(
            "resize",
            function() {

                clearTimeout(resizeTimer);

                resizeTimer =
                    setTimeout(
                        positionInstagram,
                        50
                    );

            }
        );


        /* =========================================
           ORIENTATION CHANGE
        ========================================= */

        window.addEventListener(
            "orientationchange",
            function() {

                setTimeout(
                    positionInstagram,
                    150
                );

            }
        );


        /* =========================================
           INITIAL POSITION CHECK
        ========================================= */

        setTimeout(
            positionInstagram,
            300
        );


        /* =========================================
           SOUND BUTTON
        ========================================= */

        soundButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();


                video.muted =
                    !video.muted;


                if (video.muted) {

                    soundButton.textContent =
                        "🔇";

                    soundButton.setAttribute(
                        "aria-label",
                        "Turn sound on"
                    );

                } else {

                    video.volume = 1;

                    soundButton.textContent =
                        "🔊";

                    soundButton.setAttribute(
                        "aria-label",
                        "Mute sound"
                    );

                    video.play().catch(() => {});
                }


                soundButton.classList.remove(
                    "clicked"
                );

                void soundButton.offsetWidth;

                soundButton.classList.add(
                    "clicked"
                );

            }
        );


        /* =========================================
           USER INTERACTION
        ========================================= */

        function userInteraction() {

            if (!video.muted) {

                video.volume = 1;

                video.play().catch(() => {});
            }

        }


        document.addEventListener(
            "touchstart",
            userInteraction,
            { passive: true }
        );


        document.addEventListener(
            "click",
            userInteraction
        );


        /* =========================================
           PAGE VISIBILITY
        ========================================= */

        document.addEventListener(
            "visibilitychange",
            function() {

                if (!document.hidden) {

                    startVideo();

                }

            }
        );


        /* =========================================
           PREVENT VIDEO FROM STAYING PAUSED
        ========================================= */

        video.addEventListener(
            "pause",
            function() {

                if (!document.hidden) {

                    video.play().catch(() => {});

                }

            }
        );

    </script>

</body>

</html>
