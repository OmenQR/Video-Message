<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#e9e7f4">

    <title></title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e9e7f4;
        }

        body {
            position: fixed;
            inset: 0;
        }


        /* =========================================
           SOFT PREMIUM BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                linear-gradient(
                    120deg,
                    #eeeaf8 0%,
                    #e9edf9 35%,
                    #f4eaf1 68%,
                    #e8f2ef 100%
                );

            z-index: 0;
        }


        /*
           Instead of obvious glowing circles,
           we use very large, extremely soft
           colour fields that slowly drift.
        */

        .aurora {
            position: absolute;

            width: 85vw;
            height: 35vw;

            min-width: 600px;
            min-height: 260px;

            border-radius: 50%;

            filter: blur(70px);

            opacity: 0.18;

            pointer-events: none;
        }


        .aurora.one {

            top: -12%;
            left: -15%;

            background:
                linear-gradient(
                    90deg,
                    #d9c7ff,
                    #ffc9dc,
                    #c9dcff
                );

            transform: rotate(-12deg);

            animation:
                auroraOne 28s ease-in-out infinite alternate;
        }


        .aurora.two {

            right: -20%;
            bottom: -12%;

            background:
                linear-gradient(
                    90deg,
                    #c7e4ff,
                    #d7f1e7,
                    #e8cfff
                );

            transform: rotate(18deg);

            animation:
                auroraTwo 34s ease-in-out infinite alternate;
        }


        @keyframes auroraOne {

            0% {
                transform:
                    translate3d(-4%, -2%, 0)
                    rotate(-12deg)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(8%, 5%, 0)
                    rotate(-8deg)
                    scale(1.08);
            }

            100% {
                transform:
                    translate3d(15%, 0%, 0)
                    rotate(-14deg)
                    scale(1.02);
            }
        }


        @keyframes auroraTwo {

            0% {
                transform:
                    translate3d(4%, 3%, 0)
                    rotate(18deg)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-8%, -5%, 0)
                    rotate(13deg)
                    scale(1.08);
            }

            100% {
                transform:
                    translate3d(-15%, 0%, 0)
                    rotate(20deg)
                    scale(1.02);
            }
        }


        /* =========================================
           VERY SUBTLE FILM GRAIN
        ========================================= */

        .grain {

            position: absolute;

            inset: 0;

            opacity: 0.035;

            pointer-events: none;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");

            mix-blend-mode: soft-light;
        }


        /* =========================================
           VIDEO AREA
        ========================================= */

        .video-wrapper {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 2;

            opacity: 0;

            animation:
                videoAppear 1.2s ease forwards;
        }


        @keyframes videoAppear {

            from {
                opacity: 0;
                transform: scale(0.985);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* =========================================
           MAIN VIDEO
        ========================================= */

        #mainVideo {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: transparent;
        }


        /* =========================================
           VIGNETTE
        ========================================= */

        .vignette {

            position: fixed;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 66%,
                    rgba(60,50,80,0.08) 100%
                );
        }


        /* =========================================
           INSTAGRAM LINK
        ========================================= */

        .instagram {

            position: fixed;

            left: 50%;

            bottom:
                max(22px, env(safe-area-inset-bottom));

            transform:
                translateX(-50%)
                translateY(8px);

            z-index: 6;

            display: flex;

            align-items: center;

            gap: 5px;

            opacity: 0;

            animation:
                instagramAppear 1.2s 0.8s ease forwards;

            text-decoration: none;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.15px;

            /*
               Instagram-inspired gradient
            */

            background:
                linear-gradient(
                    90deg,
                    #f58529,
                    #dd2a7b,
                    #8134af,
                    #515bd4
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }


        /* Small Instagram camera icon */

        .instagram-icon {

            width: 12px;
            height: 12px;

            border-radius: 3.5px;

            position: relative;

            background:
                linear-gradient(
                    135deg,
                    #f58529,
                    #dd2a7b 45%,
                    #8134af 75%,
                    #515bd4
                );

            flex-shrink: 0;
        }


        .instagram-icon::before {

            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border:
                1px solid white;

            border-radius: 50%;
        }


        .instagram-icon::after {

            content: "";

            position: absolute;

            width: 2px;
            height: 2px;

            right: 2px;
            top: 2px;

            background: white;

            border-radius: 50%;
        }


        .instagram:hover {

            transform:
                translateX(-50%)
                translateY(-2px);

            opacity: 1;
        }


        .instagram:active {

            transform:
                translateX(-50%)
                scale(0.96);
        }


        @keyframes instagramAppear {

            0% {

                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(8px);
            }

            100% {

                opacity: 0.88;

                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }


        /* Very subtle floating effect */

        @keyframes instagramFloat {

            0%,
            100% {
                margin-bottom: 0;
            }

            50% {
                margin-bottom: 2px;
            }
        }


        /* =========================================
           SOUND BUTTON
        ========================================= */

        #soundButton {

            position: fixed;

            right:
                max(18px, env(safe-area-inset-right));

            bottom:
                max(18px, env(safe-area-inset-bottom));

            width: 50px;
            height: 50px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,0.45);

            background:
                rgba(35,32,45,0.35);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 21px;

            cursor: pointer;

            z-index: 10;

            box-shadow:
                0 8px 25px rgba(60,50,80,0.18),
                inset 0 1px 1px rgba(255,255,255,0.22);

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        #soundButton:hover {

            transform: scale(1.08);

            background:
                rgba(35,32,45,0.55);
        }


        #soundButton:active {

            transform: scale(0.88);
        }


        /* =========================================
           SOUND BUTTON PULSE
        ========================================= */

        #soundButton::after {

            content: "";

            position: absolute;

            inset: -3px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,0.35);

            animation:
                buttonPulse 3.5s ease-in-out infinite;

            pointer-events: none;
        }


        @keyframes buttonPulse {

            0%,
            100% {
                transform: scale(0.95);
                opacity: 0;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.5;
            }
        }


        /* =========================================
           BUTTON CLICK ANIMATION
        ========================================= */

        #soundButton.clicked {

            animation:
                buttonClick 0.4s ease;
        }


        @keyframes buttonClick {

            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(0.82);
            }

            70% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            #soundButton {

                width: 46px;
                height: 46px;

                font-size: 19px;

                right:
                    max(15px, env(safe-area-inset-right));

                bottom:
                    max(15px, env(safe-area-inset-bottom));
            }


            .instagram {

                font-size: 10px;

                bottom:
                    max(17px, env(safe-area-inset-bottom));
            }


            .instagram-icon {

                width: 11px;
                height: 11px;
            }
        }


        /* =========================================
           LANDSCAPE
        ========================================= */

        @media (orientation: landscape) {

            #soundButton {

                right: 20px;
                bottom: 20px;
            }


            .instagram {

                bottom: 18px;
            }
        }


        /* =========================================
           REDUCED MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .aurora,
            #soundButton::after,
            .instagram {

                animation: none;
            }

            .video-wrapper {

                animation: none;

                opacity: 1;
            }

            .instagram {

                opacity: 0.88;

                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         PREMIUM BACKGROUND
    ========================================= -->

    <div class="background">

        <div class="aurora one"></div>

        <div class="aurora two"></div>

        <div class="grain"></div>

    </div>


    <!-- =========================================
         MAIN VIDEO
    ========================================= -->

    <div class="video-wrapper">

        <video
            id="mainVideo"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto">

            <source
                src="video.mp4"
                type="video/mp4">

        </video>

    </div>


    <!-- =========================================
         VIGNETTE
    ========================================= -->

    <div class="vignette"></div>


    <!-- =========================================
         INSTAGRAM
    ========================================= -->

    <a
        class="instagram"
        href="https://www.instagram.com/gyankumar00/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram @gyankumar00">

        <span class="instagram-icon"></span>

        <span>@gyankumar00</span>

    </a>


    <!-- =========================================
         SOUND BUTTON
    ========================================= -->

    <button
        id="soundButton"
        aria-label="Turn sound on">

        🔇

    </button>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const video =
            document.getElementById("mainVideo");

        const soundButton =
            document.getElementById("soundButton");


        /* =========================================
           INITIAL VIDEO SETTINGS
        ========================================= */

        video.muted = true;

        video.volume = 1;


        /* =========================================
           AUTOPLAY
        ========================================= */

        function startVideo() {

            video.play().catch(() => {});

        }


        startVideo();


        /* =========================================
           SOUND BUTTON
        ========================================= */

        soundButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                video.muted = !video.muted;


                if (video.muted) {

                    soundButton.textContent = "🔇";

                    soundButton.setAttribute(
                        "aria-label",
                        "Turn sound on"
                    );

                } else {

                    video.volume = 1;

                    soundButton.textContent = "🔊";

                    soundButton.setAttribute(
                        "aria-label",
                        "Mute sound"
                    );

                    video.play().catch(() => {});

                }


                soundButton.classList.remove("clicked");

                void soundButton.offsetWidth;

                soundButton.classList.add("clicked");

            }
        );


        /* =========================================
           FIRST USER TOUCH
        ========================================= */

        function userInteraction() {

            if (!video.muted) {

                video.volume = 1;

                video.play().catch(() => {});

            }

        }


        document.addEventListener(
            "touchstart",
            userInteraction,
            { passive: true }
        );


        document.addEventListener(
            "click",
            userInteraction
        );


        /* =========================================
           PAGE VISIBILITY
        ========================================= */

        document.addEventListener(
            "visibilitychange",
            function() {

                if (!document.hidden) {

                    startVideo();

                }

            }
        );


        /* =========================================
           PREVENT VIDEO FROM STAYING PAUSED
        ========================================= */

        video.addEventListener(
            "pause",
            function() {

                if (!document.hidden) {

                    video.play().catch(() => {});

                }

            }
        );

    </script>

</body>

</html>
