<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title></title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* FULL SCREEN VIDEO */
        video {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            object-fit: cover;

            background: #000;
        }


        /* SOUND BUTTON */
        #soundBtn {

            position: fixed;

            right: 18px;
            bottom: 18px;

            width: 48px;
            height: 48px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.55);

            backdrop-filter: blur(8px);

            color: white;

            font-size: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 10;

            transition: 0.25s ease;

            -webkit-tap-highlight-color: transparent;
        }


        #soundBtn:hover {
            transform: scale(1.08);

            background: rgba(0, 0, 0, 0.75);
        }


        #soundBtn:active {
            transform: scale(0.92);
        }

    </style>

</head>

<body>


    <!-- VIDEO -->

    <video
        id="video"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
    >

        <source src="video.mp4" type="video/mp4">

    </video>


    <!-- ONLY SOUND BUTTON -->

    <button id="soundBtn" aria-label="Toggle sound">
        🔇
    </button>


    <script>

        const video = document.getElementById("video");
        const soundBtn = document.getElementById("soundBtn");


        // Start muted so autoplay works
        video.muted = true;
        video.volume = 1;

        video.play().catch(() => {});


        // Toggle sound
        soundBtn.addEventListener("click", function (event) {

            event.stopPropagation();

            video.muted = !video.muted;

            if (video.muted) {

                soundBtn.textContent = "🔇";

            } else {

                soundBtn.textContent = "🔊";

                video.volume = 1;

                video.play().catch(() => {});

            }

        });


    </script>

</body>

</html>
